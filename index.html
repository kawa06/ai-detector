<script>
async function analyze() {
    try {
        const text = document.getElementById("text").value;
        const fileInput = document.getElementById("file");
        const file = fileInput.files[0];

        let formData = new FormData();
        formData.append("text", text || "");
        if (file) {
            formData.append("file", file);
        }

        const res = await fetch("/analyze", {
            method: "POST",
            body: formData
        });

        const data = await res.json();

        document.getElementById("result").innerText = data.result || "エラー";
    } catch (e) {
        document.getElementById("result").innerText = "通信エラー";
        console.error(e);
    }
}
</script>
<script>
async function analyze() {
    const resultEl = document.getElementById("result");
    resultEl.innerText = "判定中...";

    try {
        const text = document.getElementById("text").value;
        const fileInput = document.getElementById("file");
        const file = fileInput.files[0];

        const formData = new FormData();
        formData.append("text", text);

        if (file) {
            formData.append("file", file);
        }

        const res = await fetch("/analyze", {
            method: "POST",
            body: formData
        });

        if (!res.ok) {
            resultEl.innerText = "サーバーエラー";
            return;
        }

        const data = await res.json();
        resultEl.innerText = data.result;

    } catch (e) {
        resultEl.innerText = "通信失敗";
        console.error(e);
    }
}
</script>
