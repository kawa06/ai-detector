<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>AI判定ツール</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    text-align: center;
    padding: 30px;
}

.container {
    background: white;
    padding: 20px;
    border-radius: 10px;
    width: 90%;
    max-width: 500px;
    margin: auto;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

textarea {
    width: 100%;
    height: 120px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

button {
    margin-top: 15px;
    padding: 10px 20px;
    font-size: 16px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #0056b3;
}

#result {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
}

.footer {
    margin-top: 30px;
    font-size: 14px;
}
</style>

</head>
<body>

<div class="container">

<h1>AI判定ツール</h1>

<p>この文章はAI？それとも人間？</p>

<textarea id="text" placeholder="ここに文章を入力"></textarea>

<br>

<button onclick="analyze()">判定する</button>

<p id="result"></p>

</div>

<div class="footer">
<a href="/privacy.html">プライバシーポリシー</a> |
<a href="/terms.html">利用規約</a>
</div>

<script>
async function analyze() {
    const text = document.getElementById("text").value;
    const result = document.getElementById("result");

    result.innerText = "判定中...";

    const formData = new FormData();
    formData.append("text", text);

    const res = await fetch("/analyze", {
        method: "POST",
        body: formData
    });

    const data = await res.json();
    result.innerText = data.result;
}
</script>

</body>
</html>
